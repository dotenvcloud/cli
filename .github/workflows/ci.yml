name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# Private SDK module fetch — see .github/workflows/test.yml for setup notes.
env:
  GOPRIVATE: github.com/lostlink/*

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.21', '1.22', '1.23']
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: lostlink
          repositories: dotenv-sdk-go

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Configure git for private SDK module
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: |
          go mod download
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      
      - name: Run vulnerability check
        run: govulncheck ./...
      
      - name: Run linters
        run: golangci-lint run ./...
      
      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.html
      
      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest'
        run: |
          make test-integration
      
      - name: Run compatibility tests
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.23'
        run: |
          make test-compatibility

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: lostlink
          repositories: dotenv-sdk-go

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Test build
        run: |
          make build-all
      
      - name: Test installation script
        run: |
          ./scripts/install.sh --dry-run
      
      - name: Verify version injection
        run: |
          ./bin/dotenv-linux-amd64 version