name: CI

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

# Cancel obsolete runs on the same ref. New push to a PR branch cancels
# the prior PR-sync run; new push to main cancels any in-flight main run.
# Saves Actions minutes on rapid-fire commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CLI depends on the private module github.com/dotenvcloud/sdk-go.
# Each job mints a short-lived (~1h) GitHub App installation token to fetch
# it. Repo secrets required:
#   SDK_ACCESS_APP_ID           — GitHub App ID
#   SDK_ACCESS_APP_PRIVATE_KEY  — App private key (PEM, including header)
# The App must be installed on dotenvcloud/sdk-go with Contents: Read.
permissions:
  contents: read
env:
  GOPRIVATE: github.com/dotenvcloud/*

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24', '1.25', '1.26']
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Configure git for private SDK module
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        shell: bash
        run: go mod download

      - name: Run tests
        # bash on all OSes so `-coverprofile=coverage.out ./...` token
        # parsing is consistent — PowerShell splits the `=` form and go
        # test ends up trying to load a package named `.out`.
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: cli
          name: cli-${{ matrix.os }}-${{ matrix.go }}

      - name: Build binary
        # Integration tests fork `./bin/dotenv`, so build it first.
        shell: bash
        run: go build -v -o bin/dotenv .

      - name: Run integration tests
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: go test -v -tags=integration ./test/integration/...

      - name: Run compatibility tests
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        shell: bash
        run: make test-compatibility

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        # golangci-lint typecheck needs modules present.
        run: go mod download

      - name: Install golangci-lint
        # Built with the same Go that runs the lint, so the config's
        # targeted Go version is never higher than the linter's own.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        run: go mod download

      - name: Run Gosec
        uses: securego/gosec@v2.26.1
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'

      - name: Upload SARIF
        # Private repo: Code Scanning API needs GHAS. Persist SARIF as
        # workflow artifact instead.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gosec-sarif
          path: results.sarif
          retention-days: 30

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  build:
    name: Build
    # Pre-merge cross-compile gate. Skip on push events — release.yml
    # (tag push) and nightly.yml (workflow_run on main) drive GoReleaser
    # which does the real cross-compile right after. No external workflow
    # depends on this job's check-run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, lint, security]
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Cross-compile all platforms
        run: make build-all

      - name: Test installation script
        run: ./scripts/install.sh --dry-run

      - name: Verify version injection
        run: ./bin/dotenv-linux-amd64 version
