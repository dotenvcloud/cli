name: Docker Build and Publish

on:
  # Tag-triggered image publishing is owned by release.yml (GoReleaser).
  # This workflow builds rolling main images and weekly security scans.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '0 2 * * 0' # Weekly security scan
  workflow_dispatch:

permissions:
  contents: read
  packages: write  # GHCR (if used)

env:
  REGISTRY: docker.io
  IMAGE_NAME: dotenvcloud/cli

jobs:
  build-cli:
    # Tag push and scheduled runs proceed unconditionally; workflow_run runs
    # only when the upstream CI conclusion is success.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Dockerfile uses BuildKit `--mount=type=secret,id=gh_pat` to
          # fetch the private dotenvcloud/sdk-go module. Token is a
          # short-lived GitHub App installation token (rotates per run).
          secrets: |
            gh_pat=${{ steps.app-token.outputs.token }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload scan results
        # Private repo: Code Scanning API needs GHAS. Persist SARIF as
        # workflow artifact instead.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-sarif
          path: trivy-results.sarif
          retention-days: 30
