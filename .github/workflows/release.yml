name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # For Sigstore signing
  checks: read     # wait-on-check-action lists check-runs on tag SHA

env:
  GOPRIVATE: github.com/lostlink/*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI on tagged commit
        # v1.3.4 exits failure when the target check doesn't yet exist on
        # the SHA (Build depends on test/lint/security, so it appears
        # late). v1.7.0 retries until the check shows up.
        uses: lewagon/wait-on-check-action@v1.7.0
        with:
          ref: ${{ github.sha }}
          check-name: 'Build'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: lostlink
          repositories: dotenv-sdk-go

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate completions
        run: make completions

      - name: Export GOVERSION
        # GoReleaser v2 removed `.Runtime.Goversion`; ldflag injection
        # now reads `{{ .Env.GOVERSION }}` from this var.
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          SCOOP_BUCKET_GITHUB_TOKEN: ${{ secrets.SCOOP_BUCKET_GITHUB_TOKEN }}
