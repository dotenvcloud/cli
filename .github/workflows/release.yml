name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  id-token: write  # For Sigstore signing

env:
  GOPRIVATE: github.com/dotenvcloud/*

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No `wait-on-check` gate. Tag SHA = main HEAD, which already
      # passed CI on PR merge (branch protection enforced). Re-gating
      # on tag-push CI was a 60s appearance-deadline race that broke
      # every retry. Branch protection is the real gate.

      - name: Mint GitHub App token (SDK access)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SDK_ACCESS_APP_ID }}
          private-key: ${{ secrets.SDK_ACCESS_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: sdk-go

      - name: Mint GitHub App token (Homebrew tap + Scoop bucket)
        # Short-lived (~1h), repo-scoped install token. Replaces the
        # long-lived PATs HOMEBREW_TAP_GITHUB_TOKEN and
        # SCOOP_BUCKET_GITHUB_TOKEN.
        id: publish-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
          owner: dotenvcloud
          repositories: homebrew-tap,scoop-bucket

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true

      - name: Configure git for private SDK module
        run: |
          git config --global url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/".insteadOf "https://github.com/"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate completions
        run: make completions

      - name: Export GOVERSION
        # GoReleaser v2 removed `.Runtime.Goversion`; ldflag injection
        # now reads `{{ .Env.GOVERSION }}` from this var.
        run: echo "GOVERSION=$(go version | awk '{print $3}')" >> "$GITHUB_ENV"

      - name: Install syft (SBOM generator)
        # GoReleaser's `sboms` stage shells out to `syft` (default cmd).
        # Not pre-installed on hosted runners. Generates CycloneDX JSON
        # attached to each release archive for supply-chain hygiene.
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install snapcraft
        # GoReleaser's `snapcrafts` stage shells out to `snapcraft`. Not
        # pre-installed on hosted runners. Builds the `.snap` artifact
        # consumed by `sudo snap install dotenv-cli`.
        run: sudo snap install snapcraft --classic

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_APP_TOKEN: ${{ steps.publish-token.outputs.token }}
          # Embedded into the binary (ldflags) to HMAC-sign CLI telemetry.
          # If the repo secret is unset, the goreleaser env-default leaves it
          # empty and the build is simply unsigned (no failure).
          CLI_TELEMETRY_SECRET: ${{ secrets.CLI_TELEMETRY_SECRET }}

      - name: Scan released binaries
        run: |
          # Scan Docker images with Trivy
          docker run --rm aquasec/trivy image dotenvcloud/cli:latest
