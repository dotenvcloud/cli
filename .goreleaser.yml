version: 2
project_name: dotenv-cli

before:
  hooks:
    - go mod tidy
    - go generate ./...
    - make completions  # Generate shell completions

builds:
  - id: dotenv
    main: ./main.go
    binary: dotenv
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64  # Not common yet
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
      - -X main.goVersion={{.Env.GOVERSION}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - completions/*

checksum:
  name_template: 'checksums.txt'

signs:
  # cosign v2.x defaults to `--new-bundle-format`, which makes
  # --output-certificate / --output-signature no-ops and writes the
  # cert + signature into a single .bundle file. Old config tried
  # to open an empty cert/sig path → "create bundle file: open : no
  # such file or directory".
  - cmd: cosign
    signature: '${artifact}.bundle'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'
    artifacts: checksum
    output: true

sboms:
  # Default cmd is `syft` and default args write a CycloneDX JSON
  # alongside each archive. The previous custom args used the v0.x
  # `--file` flag which syft v1 removed → "command did not write any
  # files". Stick to the defaults.
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

brews:
  - name: dotenv-cli
    repository:
      owner: dotenvcloud
      name: homebrew-tap
      token: "{{ .Env.PUBLISH_APP_TOKEN }}"
    directory: Formula
    homepage: "https://dotenv.cloud"
    description: "Secure environment variable management CLI"
    license: "MIT"
    dependencies:
      - name: ca-certificates
        type: optional
    install: |
      bin.install "dotenv"
      
      bash_completion.install "completions/dotenv.bash" => "dotenv"
      zsh_completion.install "completions/dotenv.zsh" => "_dotenv"
      fish_completion.install "completions/dotenv.fish"
    test: |
      system "#{bin}/dotenv", "version"
    caveats: |
      To use dotenv CLI, you need to authenticate first:
        dotenv login

      For more information, visit:
        https://dotenv.cloud/docs/cli

scoops:
  - repository:
      owner: dotenvcloud
      name: scoop-bucket
      token: "{{ .Env.PUBLISH_APP_TOKEN }}"
    directory: bucket
    homepage: "https://dotenv.cloud"
    description: "Secure environment variable management CLI"
    license: MIT

# Phase 2: Linux packages
nfpms:
  - id: packages
    package_name: dotenv-cli
    vendor: DotEnv
    homepage: https://dotenv.cloud
    maintainer: DotEnv <support@dotenv.cloud>
    description: Secure environment variable management CLI
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    dependencies:
      - ca-certificates
    contents:
      - src: ./completions/dotenv.bash
        dst: /etc/bash_completion.d/dotenv
      - src: ./completions/dotenv.zsh
        dst: /usr/share/zsh/site-functions/_dotenv
      - src: ./completions/dotenv.fish
        dst: /usr/share/fish/vendor_completions.d/dotenv.fish

# Phase 3: Snap package
snapcrafts:
  - name: dotenv-cli
    summary: Secure environment variable management CLI
    description: |
      DotEnv CLI provides secure access to environment variables stored in the cloud.
      Features include encryption, team collaboration, and audit logging.
    grade: stable
    confinement: strict
    license: MIT
    apps:
      dotenv:
        command: dotenv
        plugs: [network, home]

# Docker images. GoReleaser builds the binary outside Docker, so use
# `Dockerfile.goreleaser` (single-stage, COPY prebuilt binary) — NOT
# the from-source multi-stage `Dockerfile` (which is for
# docker-publish.yml's rolling main builds).
dockers:
  - image_templates:
      - "dotenvcloud/cli:{{ .Version }}-amd64"
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
    dockerfile: Dockerfile.goreleaser

  - image_templates:
      - "dotenvcloud/cli:{{ .Version }}-arm64"
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-arm64"
    use: buildx
    goarch: arm64
    build_flag_templates:
      - "--platform=linux/arm64"
    dockerfile: Dockerfile.goreleaser

docker_manifests:
  - name_template: "dotenvcloud/cli:{{ .Version }}"
    image_templates:
      - "dotenvcloud/cli:{{ .Version }}-amd64"
      - "dotenvcloud/cli:{{ .Version }}-arm64"

  - name_template: "dotenvcloud/cli:latest"
    image_templates:
      - "dotenvcloud/cli:{{ .Version }}-amd64"
      - "dotenvcloud/cli:{{ .Version }}-arm64"
    skip_push: "{{ .Prerelease }}"

  - name_template: "ghcr.io/dotenvcloud/cli:{{ .Version }}"
    image_templates:
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-amd64"
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-arm64"

  - name_template: "ghcr.io/dotenvcloud/cli:latest"
    image_templates:
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-amd64"
      - "ghcr.io/dotenvcloud/cli:{{ .Version }}-arm64"
    skip_push: "{{ .Prerelease }}"

release:
  github:
    owner: dotenvcloud
    name: cli
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"
  footer: |
    ## Installation

    ### Homebrew
    ```bash
    brew tap dotenvcloud/dotenv
    brew install dotenv-cli
    ```

    ### Scoop
    ```bash
    scoop bucket add dotenv https://github.com/dotenvcloud/scoop-bucket
    scoop install dotenv-cli
    ```

    ### Direct Download
    ```bash
    curl -sSL https://dotenv.cloud/install.sh | bash
    ```

    ### Nightly (bleeding-edge main HEAD)
    ```bash
    curl -sSL https://dotenv.cloud/install.sh | bash -s -- --nightly
    ```
    Tracks rolling `main` HEAD. See [docs/INSTALLATION.md](https://github.com/dotenvcloud/cli/blob/main/docs/INSTALLATION.md#release-channels).

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: Bug fixes
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Security
      regexp: "^.*security[(\\w)]*:+.*$"
      order: 2
    - title: Other
      order: 999
